     (공개 저장소라 주소를 아는 사람은 누구나 볼 수 있음. 올리기는 토큰을 넣은 브라우저에서 ☁️ GitHub 동기화로) */
  var PUB_NOTES="https://raw.githubusercontent.com/0702080/bible-notes-data/main/notes.json", pubBusy=false;
  async function pubPull(why){
    if(ghCfg()||sbSession()||pubBusy||!navigator.onLine||!backend)return;
    pubBusy=true;
    try{
      // GitHub API는 올린 즉시 최신 파일을 줌 (시간당 60번 제한) → 막히면 raw 주소로 (몇 분 늦을 수 있음)
      var r=null; try{r=await fetch("https://api.github.com/repos/0702080/bible-notes-data/contents/notes.json?t="+Date.now(),{cache:"no-store",headers:{"Accept":"application/vnd.github.raw+json"}})}catch(e){}
      if(!r||!r.ok)r=await fetch(PUB_NOTES+"?t="+Date.now(),{cache:"no-store"});
      if(!r.ok)return;
      var obj=JSON.parse(await r.text()); if(!obj||!Array.isArray(obj.notes))return;
      var res=mergeData(obj,true);
      if(res.added||res.updated||res.removed){render(); if(why==="start")toast("GitHub에서 노트를 받아 왔어요 ("+(res.added+res.updated)+"개)")}
    }catch(e){}finally{pubBusy=false}
  }
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&!ghCfg())pubPull("back")});

  function layoutPdf(list,subtitle){
    var mc=document.createElement("canvas").getContext("2d");
    var pages=[[]], y=PM;
    function page(){return pages[pages.length-1]}
    function newPage(){pages.push([]);y=PM}
    function need(h){if(y+h>PH-PM)newPage()}
    function wrapPar(par,f,maxW){
      mc.font=f; var out=[], line="";
      par.split(/(\s+)/).filter(Boolean).forEach(function(tok){
        if(/^\s+$/.test(tok)){if(line)line+=" ";return}
        if(mc.measureText(line+tok).width<=maxW){line+=tok;return}
        if(line.trim()){out.push(line.replace(/\s+$/,""));line=""}
        if(mc.measureText(tok).width<=maxW){line=tok;return}
        Array.from(tok).forEach(function(ch){
          if(line&&mc.measureText(line+ch).width>maxW){out.push(line);line=ch}else line+=ch;
        });
      });
      out.push(line.replace(/\s+$/,""));
      return out;
    }
    function wrap(text,f,maxW){
      var out=[];
      String(text).split(/\r?\n/).forEach(function(par){out=out.concat(par.trim()?wrapPar(par,f,maxW):[""])});
      return out;
    }
    function base(lh,size){return y+lh*0.5+size*0.36}
    function text(s,x,f,color,lh,size){page().push({t:"x",s:s,x:x,y:base(lh,size),f:f,c:color})}
    function para(str,f,color,size,lh,x,marker){
      var ls=wrap(str,f,PCW-(x-PM)), last=null;
      ls.forEach(function(l,i){
        need(lh);
        if(i===0&&marker)text(marker.s,marker.x||PM,marker.f,marker.c,lh,size);
        text(l,x,f,color,lh,size);
        mc.font=f; last={w:mc.measureText(l).width,x:x,b:base(lh,size),lh:lh,page:page()};
        y+=lh;
      });

    }
    function rule(w,color){page().push({t:"l",y:y,w:w,c:color})}

    var titleF="700 48px "+PSERIF, subF="400 21px "+PSANS;
    text("말씀 묵상 노트",PM,titleF,PC.title,64,48); y+=64;
    text(subtitle,PM,subF,PC.muted,36,21); y+=44;

    var refF="700 25px "+PSANS, verseF="400 30px "+PSERIF, lblF="700 20px "+PSANS,
        medF="400 26px "+PSANS, dateF="400 20px "+PSANS, qF="500 25px "+PSANS, aF="400 25px "+PSANS, mkF="700 25px "+PSERIF;
    list.forEach(function(n,i){

      if(n.topics.length){text(n.topics.map(function(t){return "#"+t}).join("  "),PM,"500 20px "+PSANS,PC.muted,32,20); y+=32}
      para(n.text,verseF,PC.verse,30,52,PM);
      var meds=medOrder(n.meds.filter(function(m){return m.text.trim()}));
      if(meds.length){
        y+=14; need(34+44);
        text("묵상",PM,lblF,PC.muted,34,20); y+=34;
        meds.forEach(function(m,k){
          if(k)y+=12;
          var last=para(m.text.trim(),medF,PC.med,26,44,PM);
          var ds="("+dateShort(m.at)+")"; mc.font=dateF; var dw=mc.measureText(ds).width;
          if(last&&last.x+last.w+16+dw<=PM+PCW){last.page.push({t:"x",s:ds,x:last.x+last.w+16,y:last.b,f:dateF,c:PC.muted})}
          else{need(34);page().push({t:"x",s:ds,x:PM+PCW-dw,y:base(34,20),f:dateF,c:PC.muted});y+=34}
          if((m.thx||"").trim()){y+=6;para("감사: "+m.thx.trim(),medF,PC.essay,26,44,PM)}
          if((m.todo||"").trim()){y+=6;para("결론 · 할 일: "+m.todo.trim(),medF,PC.act,26,44,PM)}
        });
      }
      var qs=n.qs.filter(function(q){return q.q.trim()||q.a.trim()});
      if(qs.length){
        y+=14; need(34+42);
        text("질문과 답",PM,lblF,PC.muted,34,20); y+=34;
        qs.forEach(function(q,k){

          para(q.a.trim()||"(아직 답을 쓰지 않았어요)",aF,PC.a,25,42,PM+40+dx,{s:"A",f:mkF,c:PC.a,x:PM+dx});
        });
      }
      var acts=n.acts.filter(function(a){return a.t.trim()});
      if(acts.length){
        y+=14; need(34+42);
        text("말씀대로 사는 실천",PM,lblF,PC.muted,34,20); y+=34;
        acts.forEach(function(a){
          para(a.t.trim(),aF,a.done?PC.muted:PC.act,25,42,PM+40,{s:a.done?"■":"□",f:"400 25px "+PSANS,c:PC.act});

      var hyms=n.hymns.filter(function(h){return h.no||h.title.trim()});
      if(hyms.length){
        y+=14; need(34+42);
        text("찬송",PM,lblF,PC.muted,34,20); y+=34;
        hyms.forEach(function(h){para((h.no?h.no+"장 ":"")+h.title.trim()+(h.why?"  "+h.why:""),aF,PC.hymn,25,42,PM+40,{s:"♪",f:"400 25px "+PSANS,c:PC.hymn})});
      }
      var ess=n.essays.filter(function(x){return x.body.trim()}).sort(function(a,b){return a.at-b.at});

        y+=14; need(34+42);
        text("말씀 경험",PM,lblF,PC.muted,34,20); y+=34;

          para(x.body.trim(),"400 26px "+PSERIF,"#2C2833",26,46,PM);
        });
      }
      if(n.vids.length){
        y+=14; need(34+42);
        text("설교 영상",PM,lblF,PC.muted,34,20); y+=34;
        n.vids.forEach(function(v){para((v.title?v.title+"  ":"")+v.url,aF,PC.hymn,25,42,PM+40,{s:"▶",f:"400 25px "+PSANS,c:PC.hymn})});

  function drawPage(ctx,ops,num,total){
    ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,PW,PH);
    ctx.textBaseline="alphabetic";
    ops.forEach(function(o){
      if(o.t==="x"){ctx.font=o.f;ctx.fillStyle=o.c;ctx.fillText(o.s,o.x,o.y)}
      else{ctx.fillStyle=o.c;ctx.fillRect(PM,o.y,PCW,o.w)}
    });
    if(total>1){
      ctx.font="400 19px "+PSANS; ctx.fillStyle=PC.muted;
      var s=num+" / "+total, w=ctx.measureText(s).width;
      ctx.fillText(s,(PW-w)/2,PH-PM/2);
    }
  }
  function toJpeg(canvas){
    return new Promise(function(res,rej){
      canvas.toBlob(function(b){if(!b){rej(new Error("jpeg"));return}b.arrayBuffer().then(function(ab){res(new Uint8Array(ab))},rej)},"image/jpeg",0.9);
    });
  }
  async function buildPdf(pages){
    var enc=new TextEncoder(), chunks=[], offs=[], pos=0;
    function push(x){var u=typeof x==="string"?enc.encode(x):x;chunks.push(u);pos+=u.length}
    function obj(id){offs[id]=pos;push(id+" 0 obj\n")}
    var n=pages.length;
    push("%PDF-1.4\n%\u00e2\u00e3\u00cf\u00d3\n");
    obj(1); push("<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
    var kids=[]; for(var k=0;k<n;k++)kids.push((3+3*k)+" 0 R");
    obj(2); push("<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>\nendobj\n");
    var cv=document.createElement("canvas"); cv.width=PW; cv.height=PH;
    var ctx=cv.getContext("2d");
    for(k=0;k<n;k++){
      drawPage(ctx,pages[k],k+1,n);
      var jpg=await toJpeg(cv);
      obj(3+3*k); push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 "+(4+3*k)+" 0 R >> >> /Contents "+(5+3*k)+" 0 R >>\nendobj\n");
      obj(4+3*k); push("<< /Type /XObject /Subtype /Image /Width "+PW+" /Height "+PH+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n"); push(jpg); push("\nendstream\nendobj\n");
      var cs="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
      obj(5+3*k); push("<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream\nendobj\n");
    }
    var size=3+3*n, xref=pos;
    push("xref\n0 "+size+"\n0000000000 65535 f \n");
    for(var id=1;id<size;id++)push(("0000000000"+offs[id]).slice(-10)+" 00000 n \n");
    push("trailer\n<< /Size "+size+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF\n");
    return new Blob(chunks,{type:"application/pdf"});
  }
  async function loadPdfFonts(list){
    var serif="말씀 묵상 노트", sans="묵상질문과답저장한날노트개말씀대로사는실천찬송설교영상장♪▶□■0123456789/() ";
    list.forEach(function(n){
      serif+=n.text; sans+=n.ref;
      n.meds.forEach(function(m){sans+=m.text+dateShort(m.at)});
      n.qs.forEach(function(q){sans+=q.q+q.a});
      n.acts.forEach(function(a){sans+=a.t});
      n.hymns.forEach(function(h){sans+=h.title+h.why});
      n.vids.forEach(function(v){sans+=v.title+v.url});
      n.essays.forEach(function(x){sans+=x.title+"년월일"; serif+=x.body});
    });
    if(!document.fonts||!document.fonts.load)return;
    var uniq=function(t){return Array.from(new Set(Array.from(t))).join("")};
    serif=uniq(serif); sans=uniq(sans+"아직답을쓰지않았어요질문");
    try{
      await Promise.race([
        Promise.all([
          document.fonts.load('700 48px "Noto Sans KR"',serif),
          document.fonts.load('400 30px "Noto Sans KR"',serif),
          document.fonts.load('400 26px "Noto Sans KR"',sans),
          document.fonts.load('500 25px "Noto Sans KR"',sans),
          document.fonts.load('700 25px "Noto Sans KR"',sans)
        ]),
        new Promise(function(r){setTimeout(r,6000)})
      ]);
    }catch(e){}
  }

    setStatus("PDF를 만드는 중이에요.");

    try{

      blob=await buildPdf(layoutPdf(list,sub));

      pdfBusy=false; if(btn)btn.disabled=false; return;
    }
    pdfBusy=false;
    await saveFile(filename,blob,btn,"pdf");
  }

  var drag=null, dragRAF=0;
  function visibleSiblings(el,dir){var x=dir<0?el.previousElementSibling:el.nextElementSibling;while(x&&x.hidden)x=dir<0?x.previousElementSibling:x.nextElementSibling;return x}

    var el=drag.el, list=$("list");
    var prev=visibleSiblings(el,-1), next=visibleSiblings(el,1);
    if(prev){var pr=prev.getBoundingClientRect(); if(clientY<pr.top+pr.height/2-12){list.insertBefore(el,prev)}}
    if(next){var nr=next.getBoundingClientRect(); if(clientY>nr.top+nr.height/2+12){list.insertBefore(el,next.nextSibling)}}

  $("list").addEventListener("pointermove",function(e){if(actDrag&&e.pointerId===actDrag.pid){e.preventDefault();e.stopPropagation();actMove(e.clientY)}},true);
  $("list").addEventListener("pointerup",function(e){if(actDrag&&e.pointerId===actDrag.pid){e.stopPropagation();actEnd()}},true);
  $("list").addEventListener("pointercancel",function(e){if(actDrag&&e.pointerId===actDrag.pid){e.stopPropagation();actEnd()}},true);
  $("list").addEventListener("pointerdown",function(e){
    if(drag||e.button>0)return;
    var card=e.target.closest(".note"); if(!card)return;
    if(reorderMode){e.preventDefault(); startDrag(card,e.pointerId,e.clientY,card); return}
    var g=e.target.closest(".grip");
    if(g){e.preventDefault(); startDrag(card,e.pointerId,e.clientY,g); return}
    if(e.target.closest(NODRAG))return;
    clearPress();
    press={card:card,pid:e.pointerId,x:e.clientX,y:e.clientY,type:e.pointerType,timer:0,t0:Date.now(),target:e.target};
    if(e.pointerType==="mouse"){e.preventDefault();return}
    press.timer=setTimeout(function(){card.classList.add("pressing")},90);
    var t2=setTimeout(function(){
      if(!press||press.card!==card)return;
      var p=press; press=null; card.classList.remove("pressing");
      startDrag(p.card,p.pid,p.y,null); drag.t0=p.t0; drag.target=p.target;
    },260);
    press.timer2=t2;
  });
  $("list").addEventListener("pointermove",function(e){
    if(press&&e.pointerId===press.pid){
      var d=Math.hypot(e.clientX-press.x,e.clientY-press.y);
      if(press.type==="mouse"){
        if(d>6){var p=press; press=null; startDrag(p.card,p.pid,p.y,null); drag.moved=true; dragMove(e.clientY)}
      }else if(d>9){clearTimeout(press.timer2); clearPress()}
      return;
    }
    if(!drag||e.pointerId!==drag.pid)return;
    e.preventDefault();
    if(!drag.moved){
      if(Math.abs(e.clientY-drag.startY)<(reorderMode?4:24)){drag.y=e.clientY;return}
      drag.moved=true;
    }
    dragMove(e.clientY);
  });
  function finish(e){
    if(press&&e.pointerId===press.pid){clearTimeout(press.timer2); clearPress(); return}
    if(drag&&e.pointerId===drag.pid){
      var wasMoved=drag.moved&&Array.prototype.indexOf.call($("list").children,drag.el)!==drag.startIdx;
      var tapEl=drag.el, tapTarget=drag.target, quick=!drag.moved&&drag.t0&&(Date.now()-drag.t0)<600&&!reorderMode;
      drag.moved=wasMoved; endDrag(false);
      if(quick&&tapTarget&&tapEl){
        var tid=tapEl.dataset.id, isOpen=openIds.has(tid);
        if(!isOpen||!tapTarget.closest(".body"))toggleCard(tid,!isOpen);
      }
      suppressClick=true; setTimeout(function(){suppressClick=false},wasMoved?400:250);
    }
  }
  $("list").addEventListener("pointerup",finish);
  $("list").addEventListener("pointercancel",function(e){
    if(press&&e.pointerId===press.pid){clearTimeout(press.timer2); clearPress(); return}
    if(drag&&e.pointerId===drag.pid){drag.moved=drag.moved&&Array.prototype.indexOf.call($("list").children,drag.el)!==drag.startIdx;endDrag(false)}
  });
  $("list").addEventListener("click",function(e){if(suppressClick||reorderMode){e.stopPropagation();e.preventDefault()}},true);
  $("reorderBtn").addEventListener("click",function(){setReorder(!reorderMode)});
  $("reorderDone").addEventListener("click",function(){setReorder(false)});
  $("list").addEventListener("contextmenu",function(e){if(drag||press||(e.target.closest(".note")&&!e.target.closest(NODRAG)))e.preventDefault()});
  document.addEventListener("touchmove",function(e){if(drag&&e.cancelable)e.preventDefault()},{passive:false});
  $("list").addEventListener("keydown",function(e){
    var g=e.target.closest&&e.target.closest(".grip"); if(!g)return;
    if(e.key!=="ArrowUp"&&e.key!=="ArrowDown")return;
    e.preventDefault();
    var el=g.closest(".note"), list=$("list"), sib=visibleSiblings(el,e.key==="ArrowUp"?-1:1); if(!sib)return;
    if(e.key==="ArrowUp")list.insertBefore(el,sib); else list.insertBefore(el,sib.nextSibling);
    commitOrder(); render();
    var g2=cards.get(el.dataset.id); if(g2)g2.querySelector(".grip").focus();
  });

  /* ---------- toolbar ---------- */
  function syncSortBtn(){$("sortBtn").textContent=sortMode==="recent"?"최근순":sortMode==="bible"?"성경순":"내 순서"}
  $("sortBtn").addEventListener("click",function(){
    sortMode=sortMode==="recent"?"bible":sortMode==="bible"?"custom":"recent";
    try{localStorage.setItem("bible-notes-sort",sortMode)}catch(e){}
    syncSortBtn(); render();
  });
  $("filterBtn").addEventListener("click",function(){
    var f=$("filter"), show=f.hidden; f.hidden=!show; this.setAttribute("aria-pressed",String(show));
    if(show)f.focus(); else if(f.value){f.value="";filterText="";render()}
  });
  document.addEventListener("click",function(e){
    // 누른 버튼이 바로 다른 버튼으로 바뀌어도(노트 삭제 → 삭제하기) 메뉴 안을 누른 것으로 봄
    var path=e.composedPath?e.composedPath():[];
    document.querySelectorAll("details.menu[open]").forEach(function(d){if(!d.contains(e.target)&&path.indexOf(d)<0)d.open=false});
  });
  $("topMenu").addEventListener("click",function(e){if(e.target.closest(".pop button"))this.open=false});
  $("openProgBtn").addEventListener("click",openProg);
  $("prayReadBtn").addEventListener("click",function(){$("topMenu").open=false;openPrayRead(null)});
  $("foldAll").addEventListener("click",function(){
    if(notes.size&&openIds.size>=notes.size)openIds.clear();
    else notes.forEach(function(_,id){openIds.add(id)});
    render();
  });
  var fTimer=null;
  function applyFilter(){var v=$("filter").value.trim();if(v!==filterText){filterText=v;render()}}
  ["input","keyup","compositionupdate","compositionend","search","change"].forEach(function(ev){
    $("filter").addEventListener(ev,function(){clearTimeout(fTimer);fTimer=setTimeout(applyFilter,ev==="compositionupdate"?120:0)});
  });

  /* ---------- start ---------- */
  syncSortBtn();
  render();
  var api=(window.claude&&typeof window.claude.use==="function")?window.claude:null;
  if(!api){ assetsState="none"; switchToLocal(); openManual(true); render(); return }

  api.use("assets").then(function(a){assetsNs=a||null;assetsState=a?"ready":"none";render()},function(){assetsState="none";render()});
  api.use("downloads").then(function(d){
    if(!d)return;
    downloadsNs=d; $("exportTxt").hidden=false; $("exportPdf").hidden=false;
    document.querySelectorAll(".exportone").forEach(function(b){b.hidden=false});
  },function(){});
  api.use("sample").then(function(s){
    if(s){sampleFn=s;$("searchArea").hidden=false;document.querySelectorAll('.sugq,.suga,.sugh,.fbtn:not(.pickb)').forEach(function(b){b.hidden=false});render()}
    else openManual(true);
  },function(){openManual(true)});

  Promise.all([api.use("db"),api.use("user")]).then(async function(r){
    var db=r[0], user=r[1];
    var id=user?await user.id():null;
    if(!db||!id){switchToLocal();return}
    backend=dbBackend(db,id);
    render();
  },function(){switchToLocal()});
})();
</script>
</body></html>
