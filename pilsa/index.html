<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>요한복음 필사 진도표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style id="css">
:root{
  --paper:#ECECE8; --sheet:#F6F6F3; --rule:#D5D3CC; --ink:#2E2A36; --muted:#6E6878;
  --violet:#6A45B0; --orange:#E97A12; --green:#1F7A45; --blue:#2447B8; --sky:#1C93CF; --pink:#D94A90; --pencil:#4A4553;
  --focus:#2A63B8;
  --serif:"Gowun Batang","Noto Serif KR","AppleMyungjo","Batang",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1B1A1E; --sheet:#242228; --rule:#3A3740; --ink:#ECE8F2; --muted:#A39CAD;
    --violet:#AE90E0; --orange:#F4974A; --green:#52B87A; --blue:#7C98EE; --sky:#5CC0EE; --pink:#F08AC0; --pencil:#C9C3D2; --focus:#6B9BE6;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1A1E; --sheet:#242228; --rule:#3A3740; --ink:#ECE8F2; --muted:#A39CAD;
  --violet:#AE90E0; --orange:#F4974A; --green:#52B87A; --blue:#7C98EE; --sky:#5CC0EE; --pink:#F08AC0; --pencil:#C9C3D2; --focus:#6B9BE6;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:28px 18px 48px}
h1{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.25;margin:0;color:var(--violet);letter-spacing:-.01em}
.lead{margin:6px 0 0;color:var(--muted);font-size:15px}
h2{font-family:var(--serif);font-weight:700;font-size:19px;margin:34px 0 12px;color:var(--ink)}

/* progress */
.progress{margin-top:22px;padding:16px 16px 14px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.now{font-family:var(--serif);font-size:18px;font-weight:700}
.count{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:repeat(21,1fr);gap:3px;margin-top:12px}
.bar i{display:block;height:8px;border-radius:2px;background:var(--rule);position:relative;overflow:hidden}
.bar i b{position:absolute;inset:0 auto 0 0;background:var(--violet);border-radius:2px}
.status{margin-top:10px;font-size:13px;color:var(--muted);min-height:1.3em}

/* pens */
.pens{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.page{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 14px 12px}
.page h3{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--muted)}
.pen{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14.5px}
.stroke{flex:0 0 26px;height:6px;border-radius:3px}
.pen strong{flex:0 0 auto;font-weight:700;min-width:2.2em}
.penmeta{margin:12px 0 0;font-size:13px;color:var(--muted);line-height:1.6}
@media (max-width:520px){.pens{grid-template-columns:1fr}}

/* lenses */
.lenses{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.lenses li{display:grid;grid-template-columns:30px 12px 1fr;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--rule)}
.lenses .d{font-family:var(--serif);font-weight:700;font-size:16px;text-align:center}
.lenses .dot{width:12px;height:12px;border-radius:50%}
.lenses .t{font-size:14.5px}
.lenses .t small{display:block;color:var(--muted);font-size:12.5px}

/* grid */
.grid{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:6px 10px 10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,34px);column-gap:5px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row.head{position:sticky;top:env(safe-area-inset-top,0px);background:var(--sheet);z-index:1;padding:8px 0}
.row.head span{text-align:center;font-family:var(--serif);font-weight:700;font-size:15px}
.ch{min-width:0}
.ch .n{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--violet)}
.ch .w{font-size:12px;color:var(--muted);margin-left:6px}
.ch .th{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;line-height:1.35;color:var(--muted);word-break:keep-all;margin-top:1px}
.row.current{background:linear-gradient(90deg,color-mix(in srgb,var(--violet) 10%,transparent),transparent 70%);margin:0 -10px;padding-left:10px;padding-right:10px}
.row.current .w::after{content:" 이번 주";color:var(--violet);font-weight:700}
.row.done .n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.box{appearance:none;-webkit-appearance:none;width:34px;height:34px;border:1.5px solid var(--rule);border-radius:8px;background:transparent;padding:0;cursor:pointer;display:grid;place-items:center;position:relative;touch-action:manipulation}
.box::after{content:"";width:18px;height:18px;border-radius:50%;background:var(--c);transform:scale(0);transition:transform .16s ease-out}
.box[aria-pressed="true"]{border-color:var(--c)}
.box[aria-pressed="true"]::after{transform:scale(1)}
.box:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.grid.saving .box{pointer-events:none;opacity:.6}
.note{margin:14px 2px 0;font-size:13.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.box::after{transition:none}}
@media (max-width:380px){
  .row{grid-template-columns:minmax(0,1fr) repeat(7,30px);column-gap:4px}
  .box{width:30px;height:30px}
  .box::after{width:15px;height:15px}
}
</style>
</head>
<body>
<div id="root"></div>
<template id="shell">
<main class="wrap">
  <h1>요한복음 필사 진도표</h1>
  <p class="lead">한 주에 한 장, 7번 반복하며 묵상하기</p>

  <section class="progress" aria-live="polite">
    <div class="progress-top"><span class="now" id="now"></span><span class="count" id="count"></span></div>
    <div class="bar" id="bar" aria-hidden="true"></div>
    <div class="status" id="status"></div>
  </section>

  <h2>볼펜 색상</h2>
  <div class="pens">
    <div class="page">
      <h3>왼쪽 페이지, 말씀 필사</h3>
      <div class="pen"><span class="stroke" style="background:var(--orange)"></span><strong>주황</strong>예수님 말씀</div>
      <div class="pen"><span class="stroke" style="background:var(--violet)"></span><strong>보라</strong>기본 서사, 장·절 번호</div>
      <div class="pen"><span class="stroke" style="background:var(--green)"></span><strong>초록</strong>예수님과 대화하는 제자</div>
      <div class="pen"><span class="stroke" style="background:var(--blue)"></span><strong>파랑</strong>그 외 사람들</div>
      <div class="pen"><span class="stroke" style="background:var(--pink)"></span><strong>분홍</strong>하나님 아버지, 천사 (선택)</div>
    </div>
    <div class="page">
      <h3>오른쪽 페이지, 묵상</h3>
      <div class="pen"><span class="stroke" style="background:var(--blue)"></span><strong>파랑</strong>기본 묵상 글</div>
      <div class="pen"><span class="stroke" style="background:var(--orange)"></span><strong>주황</strong>깨달음, 핵심 한 문장</div>
      <div class="pen"><span class="stroke" style="background:var(--green)"></span><strong>초록</strong>적용 결단, 실천</div>
      <div class="pen"><span class="stroke" style="background:var(--violet)"></span><strong>보라</strong>궁금한 점</div>
      <div class="pen"><span class="stroke" style="background:var(--sky)"></span><strong>하늘</strong>연결 말씀 (다른 성경 구절)</div>
    </div>
  </div>
  <p class="penmeta">펜은 유니 0.28 젤펜 6색(보라, 초록, 하늘, 파랑, 분홍, 주황)을 써요.<br>젤 잉크라 쓴 뒤 몇 초 기다리거나 손 아래에 종이를 받치면 번짐이 줄어요.</p>

  <h2>요일별 묵상 관점</h2>
  <ul class="lenses" id="lenses"></ul>

  <h2>주차별 진도</h2>
  <div class="grid" id="grid"></div>
  <p class="note">칸을 누르면 그날 필사가 체크되고, 한 번 더 누르면 지워져요. 긴 장(6장, 8장, 11장)은 월요일만 전체를 쓰고 화요일부터는 그날 관점에 해당하는 부분만 다시 써도 좋아요.</p>
</main>
</template>
<script type="application/json" id="state">{"checks":{"1-0":true,"1-1":true,"1-2":true,"1-3":true,"1-4":true,"1-5":true,"1-6":true,"2-0":true,"2-1":true,"2-2":true,"2-3":true,"2-4":true,"2-5":true,"2-6":true,"3-0":true,"3-1":true,"4-3":true,"4-1":true,"5-1":true,"5-2":true,"5-3":true,"5-4":true,"5-0":true,"7-1":true,"6-1":true,"6-2":true,"6-4":true,"6-5":true,"8-3":true,"8-5":true,"8-6":true,"9-0":true,"9-3":true,"9-4":true,"10-0":true,"10-2":true,"10-3":true,"10-4":true,"10-5":true}}</script>
<script id="app">
(function(){
  var THEMES=["말씀이 육신이 되심","가나 혼인 잔치, 성전 정결","니고데모, 거듭남","사마리아 여인","베데스다 연못","오병이어, 생명의 떡","초막절, 생수의 강","세상의 빛","눈먼 사람을 고치심","선한 목자","나사로를 살리심","향유 부음, 예루살렘 입성","제자들의 발을 씻기심","길, 진리, 생명","포도나무와 가지","성령의 약속","예수님의 기도","체포와 재판","십자가","부활","디베랴 바닷가, 베드로"];
  var DAYS=[
    {d:"월",c:"var(--violet)",t:"전체 흐름 파악",s:"처음 마음에 남은 한 절"},
    {d:"화",c:"var(--orange)",t:"예수님은 무엇을 말씀하셨나?",s:"주황 글씨만 따라 읽기"},
    {d:"수",c:"var(--green)",t:"제자(대화 상대)는 어떻게 반응했나? 나라면?",s:"초록 글씨만 따라 읽기"},
    {d:"목",c:"var(--blue)",t:"다른 사람들은 예수님을 어떻게 봤나?",s:"파랑 글씨만 따라 읽기"},
    {d:"금",c:"var(--pencil)",t:"반복되는 단어는 무엇이고, 왜 반복될까?",s:"한 단어 묵상"},
    {d:"토",c:"var(--pencil)",t:"작은 표현에 머물기",s:"장소, 시간, 동작"},
    {d:"일",c:"var(--pencil)",t:"한 주 정리",s:"한 문장 요약, 적용 결단"}
  ];
  var TOTAL=21*7, LS="john-pilsa-v1";
  var HEAD_TOP='<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>요한복음 필사 진도표</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">\n';

  var CSS=document.getElementById("css").textContent;
  var SHELL=document.getElementById("shell").innerHTML;
  var APP=document.getElementById("app").textContent;

  var state;
  try{state=JSON.parse(document.getElementById("state").textContent)}catch(e){state={}}
  if(!state||typeof state!=="object")state={};
  if(!state.checks||typeof state.checks!=="object")state.checks={};

  var mode="pending", roFlag=false, art=null, timer=null, busy=false, dirty=false, retried=false, delayed=false;

  function readLocal(){try{var v=localStorage.getItem(LS);return v?JSON.parse(v):null}catch(e){return null}}
  function writeLocal(ro){try{localStorage.setItem(LS,JSON.stringify({ro:!!ro,checks:state.checks}))}catch(e){}}

  var root=document.getElementById("root");
  root.innerHTML=SHELL;
  var $=function(id){return document.getElementById(id)};

  $("lenses").innerHTML=DAYS.map(function(x){
    return '<li><span class="d" style="color:'+x.c+'">'+x.d+'</span><span class="dot" style="background:'+x.c+'"></span><span class="t">'+x.t+'<small>'+x.s+'</small></span></li>';
  }).join("");

  function k(ch,di){return ch+"-"+di}
  function isOn(ch,di){return state.checks[k(ch,di)]===true}
  function chCount(ch){var n=0;for(var i=0;i<7;i++)if(isOn(ch,i))n++;return n}

  function renderGrid(){
    var cur=0;for(var c=1;c<=21;c++){if(chCount(c)<7){cur=c;break}}
    var h='<div class="row head"><span></span>'+DAYS.map(function(x){return '<span style="color:'+x.c+'">'+x.d+'</span>'}).join("")+'</div>';
    for(var ch=1;ch<=21;ch++){
      var cls="row"+(ch===cur?" current":"")+(chCount(ch)===7?" done":"");
      h+='<div class="'+cls+'"><div class="ch"><span class="n">'+ch+'장</span><span class="w">'+ch+'주</span><span class="th">'+THEMES[ch-1]+'</span></div>';
      for(var di=0;di<7;di++){
        h+='<button type="button" class="box" style="--c:'+DAYS[di].c+'" data-ch="'+ch+'" data-d="'+di+'" aria-pressed="'+isOn(ch,di)+'" aria-label="'+ch+'장 '+DAYS[di].d+'요일"></button>';
      }
      h+='</div>';
    }
    $("grid").innerHTML=h;
    renderSummary(cur);
  }
  function renderSummary(cur){
    var total=0;for(var c=1;c<=21;c++)total+=chCount(c);
    $("count").textContent=total+" / "+TOTAL+"회 필사";
    $("now").textContent=cur?(cur+"주 차, 요한복음 "+cur+"장"):"요한복음 21장을 모두 마쳤어요";
    var b="";for(var c2=1;c2<=21;c2++){b+='<i><b style="width:'+(chCount(c2)/7*100)+'%"></b></i>'}
    $("bar").innerHTML=b;
  }
  function setStatus(t){$("status").textContent=t}

  function buildDoc(){
    var json=JSON.stringify({checks:state.checks}).replace(/</g,"\\u003c");
    return '<!doctype html>\n<html lang="ko"><head>\n'+HEAD_TOP+'<style id="css">'+CSS+'</style>\n</head>\n<body>\n<div id="root"></div>\n<template id="shell">'+SHELL+'</template>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="app">'+APP+'<\/script>\n</body></html>\n';
  }

  function toLocal(msg,ro){
    mode="local";roFlag=!!ro;busy=false;$("grid").classList.remove("saving");
    if(ro||dirty)writeLocal(roFlag);setStatus(msg||"체크 내용은 이 기기에만 저장돼요.");
  }

  function schedule(){
    dirty=true;
    if(mode==="local"){writeLocal(roFlag);return}
    if(mode==="pending"){setStatus("저장 준비 중이에요.");return}
    setStatus("잠시 후 저장돼요.");
    clearTimeout(timer);timer=setTimeout(flush,1800);
  }

  async function flush(){
    if(busy||!dirty||mode!=="artifact")return;
    busy=true;$("grid").classList.add("saving");setStatus("저장 중이에요.");
    try{
      await art.publish(buildDoc());
      setStatus("저장했어요.");
    }catch(e){
      busy=false;$("grid").classList.remove("saving");
      var c=e&&e.code;
      if(c==="conflict"){setStatus("다른 곳에서 바뀐 내용으로 새로 불러오는 중이에요.");return}
      if(["not_writer","not_granted","not_declared","consent_required","capability_disabled","capability_removed"].indexOf(c)>=0){toLocal("이 화면에서는 진도표를 저장할 수 없어서, 체크 내용은 이 기기에만 저장돼요.",true);return}
      if(c==="rate_limited"&&!delayed){delayed=true;setStatus("잠시 뒤에 저장할게요.");timer=setTimeout(flush,15000);return}
      if(c==="upstream_error"&&!retried){retried=true;timer=setTimeout(flush,1200+Math.random()*1800);return}
      if(c==="too_large"||c==="invalid_content"||c==="transform_error"){toLocal("저장 형식에 문제가 있어 이 기기에만 저장해요.");return}
      setStatus("저장하지 못했어요. 칸을 다시 누르면 저장을 다시 시도해요.");
    }
  }

  $("grid").addEventListener("click",function(ev){
    var b=ev.target.closest(".box");if(!b||busy)return;
    var ch=+b.dataset.ch, di=+b.dataset.d, key=k(ch,di);
    if(state.checks[key])delete state.checks[key];else state.checks[key]=true;
    renderGrid();
    var again=$("grid").querySelector('.box[data-ch="'+ch+'"][data-d="'+di+'"]');if(again)again.focus({preventScroll:true});
    schedule();
  });

  var saved=readLocal();
  if(saved&&saved.ro&&saved.checks){state.checks=saved.checks;mode="local";roFlag=true}
  renderGrid();
  if(mode==="local")setStatus("체크 내용은 이 기기에만 저장돼요.");

  var api=window.claude&&typeof window.claude.use==="function"?window.claude:null;
  if(!api){
    var sv=readLocal(); if(sv&&sv.checks){state.checks=sv.checks;renderGrid()}
    if(mode!=="local")toLocal("체크 내용은 이 브라우저에 저장돼요.",false);
  }
  else if(mode!=="local"){
    api.use("artifact").then(function(ns){
      if(!ns){
        var l=readLocal();if(l&&l.checks&&!dirty){state.checks=l.checks;renderGrid()}
        toLocal();return;
      }
      art=ns;mode="artifact";setStatus("");
      if(dirty)schedule();
    },function(){toLocal()});
  }
})();
</script>
</body></html>
