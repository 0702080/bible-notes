<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>성경 통독표</title>
<meta name="theme-color" content="#2A211C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 아이보리 밝은 바탕 (2026-10-11 사용자 요청으로 검정에서 바꿈). 색은 아래 '아이보리 테마' 블록에서 덮어씀 */
  color-scheme:light;
  --paper:#121214; --sheet:#1A1A1D; --rule:#2E2E33; --ink:#ECEAF0; --muted:#9C98A4;
  --bar:#2A211C; --ring:#E8B92E; --ring5:#F4974A; --blank:#2C2C31;
  --violet:#AE90E0; --orange:#F4974A; --green:#52B87A; --blue:#7C98EE; --sky:#5CC0EE; --pink:#F08AC0;
  --five:#E1609F; --five2:#2BA3B0;
  --focus:#6B9BE6;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);
  background:var(--paper);
  font-family:var(--sans);font-size:15px;line-height:1.55;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  touch-action:manipulation;
}
.wrap{max-width:680px;margin:0 auto;padding:4px 14px 40px}
/* 맨 위 갈색 띠: 제목과 전체 진도 */
.bar{position:sticky;top:0;z-index:40;background:var(--bar);color:#fff;
  padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.bar h1{grid-column:2;margin:0;font-size:17px;font-weight:700;color:#fff;letter-spacing:0}
.bar .bar-cnt{grid-column:3;justify-self:end;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
h2{font-family:var(--sans);font-weight:700;font-size:15px;margin:28px 0 0;color:var(--muted)}

button{font-family:inherit;font-size:inherit;color:inherit}

/* 요약 */
.sum{margin-top:16px;padding:14px;border-radius:12px;background:var(--sheet);border:1px solid var(--rule);}
.sum-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sum-now{font-family:var(--sans);font-size:17px;font-weight:700}
.sum-cnt{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:5px;background:var(--rule);overflow:hidden;margin-top:10px;display:flex}
.meter i{display:block;height:100%}
.meter .me{background:var(--ring)}
.meter .both{background:var(--green)}
.halves{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.half{background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:8px 10px}
.half b{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.half span{font-family:var(--sans);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}

/* 도구 줄 */
.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.btn{
  padding:9px 13px;border:1px solid var(--rule);border-radius:999px;
  background:var(--sheet);font-size:13.5px;font-weight:500;cursor:pointer;
}
.btn:active{background:var(--rule)}
.btn.on{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:700}
.btn.wide{flex:1 1 100%;text-align:center;padding:12px}
.btn:disabled{opacity:.45}

/* 범례 */
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:12px 2px 0;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:50%;display:block}
.legend[hidden]{display:none}

/* 책 목록: 접지 않고 모두 펼친다. 책 이름 아래 10칸짜리 표 */
.books{margin-top:2px}
.bk{margin-top:18px}
.bk-h{display:flex;align-items:baseline;gap:8px;padding:0 2px 7px}
.bk-name{font-size:16px;font-weight:700}
.bk-cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 책 이름은 갈래마다 다른 색 (율법서, 역사서, 시가서, 선지서, 복음서, 서신서…) */
.bk[data-g="law"] .bk-name{color:#F5B971}
.bk[data-g="hist"] .bk-name{color:#7EC8E3}
.bk[data-g="poem"] .bk-name{color:#B9A2F0}
.bk[data-g="major"] .bk-name{color:#F28CA6}
.bk[data-g="minor"] .bk-name{color:#8FD6B4}
.bk[data-g="gospel"] .bk-name{color:#FFD27A}
.bk[data-g="paul"] .bk-name{color:#A7B8F5}
.bk[data-g="general"] .bk-name{color:#F7A98B}
.bk[data-g="rev"] .bk-name{color:#E99BD0}
.bk.full .bk-name::after{content:" ✓";color:var(--green)}
/* 책 접기·펴기 */
.bk-tg{display:flex;align-items:baseline;gap:8px;min-width:0;padding:4px 2px;margin:-4px -2px;background:none;border:0;color:inherit;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bk-chev{align-self:center;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .2s;flex:0 0 auto;margin-right:2px}
.bk.shut .bk-chev{transform:rotate(-45deg)}
.bk.shut .bk-body{display:none}
.bk.shut .bk-h{padding-bottom:0}
.bk.shut{margin-top:12px}
.findbar{position:relative;margin:0 0 2px}
.findin{width:100%;box-sizing:border-box;height:44px;padding:0 40px 0 14px;border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);font-family:inherit;font-size:15px}
.findin:focus{border-color:var(--violet);outline:none}
.findin::placeholder{color:var(--faint)}
.findx{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:32px;height:32px;padding:0;border:0;border-radius:16px;background:transparent;color:var(--muted);font-size:20px;line-height:1}
.findx[hidden]{display:none}
.findmsg{margin:8px 2px 0;font-size:12.5px;color:var(--muted)}
.findmsg[hidden]{display:none}
.foldbar{display:flex;justify-content:flex-end;margin-top:18px}
.tg-all.tg-every{font-size:13.5px;padding:7px 16px;border-radius:18px;color:var(--ink);background:color-mix(in srgb,var(--ring) 12%,#232328);border-color:color-mix(in srgb,var(--ring) 35%,var(--rule))}
h2.tg{display:flex;align-items:center;justify-content:space-between}
h2.tg[hidden],.foldbar[hidden],.bk[hidden],.sum[hidden],.shelf[hidden]{display:none}
.tg-all{font-size:12.5px;font-weight:500;color:var(--muted);background:#232328;border:1px solid var(--rule);border-radius:14px;padding:4px 12px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.bk-chev{transition:none}}
.bk-prog{--c:var(--ring);margin-left:auto;align-self:center;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  background:conic-gradient(var(--c) calc(var(--p)*1%),#34343B 0)}
.bk-prog b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--paper);font-size:11px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.bk-prog[data-st="none"]{--c:var(--muted)}
.bk-prog[data-st="none"] b{color:#7A7782}
.bk-prog[data-st="full"]{--c:var(--green);box-shadow:0 0 10px color-mix(in srgb,var(--green) 40%,transparent)}
.bk-prog[data-st="full"] b{background:var(--green);color:#0E1A12;font-size:15px}
.chips{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.chips>span{background:var(--sheet)}   /* 마지막 줄 빈칸 */
.chip{
  position:relative;isolation:isolate;aspect-ratio:1/1;--d:min(44px,90%);min-height:32px;border:0;border-radius:0;
  background:var(--sheet);font-size:13.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;
  cursor:pointer;padding:0;display:grid;place-items:center;-webkit-tap-highlight-color:transparent;
}
/* 동그라미 */
.chip::before{
  content:"";position:absolute;left:50%;top:50%;width:var(--d);aspect-ratio:1/1;transform:translate(-50%,-50%);
  border-radius:50%;border:1px solid color-mix(in srgb,var(--blank) 70%,var(--rule));background:#3A3A42;z-index:-1;transition:background .15s,box-shadow .2s;
}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:-3px}
.chip[data-s]{color:var(--ink);font-weight:700}
/* 휴대폰에서는 칸이 좁아 동그라미를 조금 작게 */
@media (max-width:520px){.chip{--d:66%;font-size:12px}.ring{transform-origin:center;width:34px!important;height:34px!important;margin:-17px 0 0 -17px!important}}
/* 읽은 장: 반짝이 없이 납작하게 채운 동그라미 (바깥 고리 없음) */
.chip[data-s="me"]{--c:#F2C94C;color:#3A2A00}
.chip[data-s="me"][data-five]{--c:#F2994A;color:#3A1C00}
.chip[data-s="both"]{--c:#5CC08A;color:#0E2E1C}
.chip[data-s="me"]::before,.chip[data-s="both"]::before{
  border:0;background:var(--c);
  box-shadow:none;
}
/* 5, 10, 15… 장째를 읽으면 번호 뒤에 꽃이 은은하게 핀다 (안 읽은 칸에는 없음) */
.chip[data-s="me"][data-five]::after,.chip[data-s="both"][data-five]::after{
  content:"🌸";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);
  font-size:26px;line-height:1;opacity:.38;z-index:-1;pointer-events:none;filter:saturate(.7) brightness(1.15);
}
@media (max-width:520px){.chip[data-s][data-five]::after{font-size:13px}}   /* 원 안에 쏙 들어가게 */
.chip[data-s="friend"]::before{border:2px dashed var(--sky)}
.chip[data-s="friend"]{color:var(--sky)}
/* 친구 표 (보기 전용) */
.who{display:flex;align-items:baseline;gap:6px;margin:8px 2px 5px;font-size:12.5px;font-weight:700}
.who span{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.me-who{color:#F2C94C;margin-top:0}
.fr-who{color:var(--sky);margin-top:10px}
.fchips{border-color:color-mix(in srgb,var(--sky) 30%,var(--rule));background:color-mix(in srgb,var(--sky) 18%,var(--rule))}
.fchips .chip{cursor:default}
.chip[data-s="fr"]{--c:var(--sky);color:#06222E;font-weight:700}
.chip[data-s="fr"]::before{border:0;background:var(--c)}
/* 얻는 순간 동그라미가 톡 튀어 오른다 */
.chip.got::before,.chip.got5::before{animation:pop .42s cubic-bezier(.26,1.4,.4,1)}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.55)}55%{transform:translate(-50%,-50%) scale(1.22)}100%{transform:translate(-50%,-50%) scale(1)}}

/* 5장마다 뜨는 작은 격려 띠 */
.toast{
  position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0));
  z-index:60;margin:0 auto;max-width:420px;
  background:var(--sheet);border:1px solid var(--rule);border-radius:14px;
  box-shadow:0 8px 26px rgba(0,0,0,.35);
  padding:12px 14px;display:grid;grid-template-columns:28px 1fr;gap:11px;align-items:center;
  animation:tin .32s cubic-bezier(.26,1.4,.4,1);
}
.toast[hidden]{display:none}
.toast.out{opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s}
/* 꽃잎이 겹치면 네모 덩어리로 보인다. 꽃잎을 작게 하고 바깥으로 벌려
   다섯 장이 따로 보이게 한다. */
.toast .ic{
  width:28px;height:28px;
  background:
    radial-gradient(circle at 50% 20%, #FFD166 0 19%, transparent 20%),
    radial-gradient(circle at 78.5% 40.7%, #FFD166 0 19%, transparent 20%),
    radial-gradient(circle at 67.6% 74.3%, #FFD166 0 19%, transparent 20%),
    radial-gradient(circle at 32.4% 74.3%, #FFD166 0 19%, transparent 20%),
    radial-gradient(circle at 21.5% 40.7%, #FFD166 0 19%, transparent 20%),
    radial-gradient(circle at 50% 50%, #F2769F 0 12%, transparent 13%);
}
.toast b{display:block;font-size:14px;line-height:1.5;font-weight:500}
.toast small{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
@keyframes tin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* 칸 밖으로 번지지 않게 동그라미 바로 바깥까지만 퍼진다 */
.ring{
  position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;pointer-events:none;
  border:1.5px solid color-mix(in srgb,var(--ring) 80%,transparent);
  animation:ring .36s ease-out forwards;
}
@keyframes ring{from{opacity:.6;transform:scale(.9)}to{opacity:0;transform:scale(1.14)}}
.spark{
  position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;
  background:#FFD36B;pointer-events:none;animation:spark .5s ease-out forwards;
}
@keyframes spark{
  from{opacity:1;transform:translate(-50%,-50%) scale(1)}
  to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.25)}
}

/* 모은 책 선반 */
.shelf{margin-top:14px;padding:12px 13px;border-radius:12px;background:var(--sheet);border:1px solid var(--rule);}
.shelf h3{margin:0 0 9px;font-family:var(--sans);font-size:15px;font-weight:700}
.shelf h3 span{font-family:var(--sans);font-size:12.5px;color:var(--muted);font-weight:400;margin-left:6px}
.medals{display:flex;flex-wrap:wrap;gap:6px}
.medal{
  padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--ink);
  border:2px solid var(--ring);
  animation:pop .4s cubic-bezier(.26,1.4,.4,1);
}
.shelf .none{margin:0;font-size:12.5px;color:var(--muted)}

/* 축복 카드 */
.cel .card{text-align:center;border-radius:18px 18px 0 0}
.cel .seal{
  width:84px;height:84px;margin:4px auto 10px;border-radius:50%;
  display:grid;place-items:center;font-size:34px;color:#fff;
  background:linear-gradient(150deg,color-mix(in srgb,var(--violet) 85%,#fff),var(--violet) 55%,color-mix(in srgb,var(--violet) 55%,#000));
  box-shadow:0 6px 20px color-mix(in srgb,var(--violet) 45%,transparent),inset 0 -3px 8px rgba(0,0,0,.2);
  animation:seal .6s cubic-bezier(.26,1.4,.4,1);
}
@keyframes seal{0%{transform:scale(.3) rotate(-18deg);opacity:0}60%{transform:scale(1.14) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.cel h3{font-size:20px;color:var(--violet);margin-bottom:2px}
.cel .bless{margin:10px 0 0;font-family:var(--sans);font-size:15.5px;color:var(--ink);line-height:1.75}
.cel .ref{margin:7px 0 0;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){
  .chip.got,.chip.got5,.medal,.cel .seal,.toast,.chip.got::before,.chip.got5::before{animation:none}
  .ring,.spark{display:none}
}

/* 대화상자 */
.sheet{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);
  display:flex;align-items:flex-end;justify-content:center;padding:0;
}
.sheet[hidden]{display:none}
.card{
  width:100%;max-width:680px;background:var(--paper);
  border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0));
  max-height:86vh;overflow:auto;
}
.card h3{font-family:var(--sans);font-size:18px;margin:0 0 4px}
.card p{margin:6px 0 0;font-size:13.5px;color:var(--muted);line-height:1.65}
.card textarea,.card input[type=text]{
  width:100%;margin-top:10px;padding:11px;font-family:var(--sans);font-size:14px;
  color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:10px;
}
.card textarea{height:96px;resize:vertical;word-break:break-all}
.card .tools{margin-top:12px}
.msg{margin-top:10px;font-size:13px;color:var(--green);min-height:1.2em}
.msg.bad{color:var(--orange)}
.note{margin:16px 2px 0;font-size:12.5px;color:var(--muted);line-height:1.7}
/* 휴대폰을 가로로 돌리면 표가 깨지므로 세로로 돌려 달라고 안내한다.
   (웹 페이지는 회전을 직접 막을 수 없어, 홈 화면 앱일 때만 세로로 고정된다) */
.turn{display:none}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){
  .turn{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:var(--paper);color:var(--ink);font-size:15px;text-align:center;padding:20px}
  .turn b{font-size:40px;display:block;animation:turn 1.6s ease-in-out infinite}
  body{overflow:hidden}
}
@keyframes turn{0%,30%{transform:rotate(90deg)}60%,100%{transform:rotate(0)}}
/* 진도 카드·뱃지 칸에 살짝 색감 (2026-10-11 사용자 요청) */
.sum{background:linear-gradient(160deg,color-mix(in srgb,var(--ring) 9%,var(--sheet)) 0%,var(--sheet) 55%,color-mix(in srgb,var(--violet) 8%,var(--sheet)) 100%);border-color:color-mix(in srgb,var(--ring) 22%,var(--rule))}
.sum-now{color:color-mix(in srgb,var(--ring) 70%,var(--ink))}
.meter{background:color-mix(in srgb,var(--ring) 12%,#2A2A30)}
.half{background:color-mix(in srgb,var(--orange) 9%,var(--paper));border-color:color-mix(in srgb,var(--orange) 26%,var(--rule))}
.half b{color:color-mix(in srgb,var(--orange) 55%,var(--muted))}
.half+.half{background:color-mix(in srgb,var(--sky) 9%,var(--paper));border-color:color-mix(in srgb,var(--sky) 26%,var(--rule))}
.half+.half b{color:color-mix(in srgb,var(--sky) 55%,var(--muted))}
#btnShare{background:color-mix(in srgb,var(--green) 12%,transparent);border-color:color-mix(in srgb,var(--green) 40%,var(--rule))}
#btnFriend{background:color-mix(in srgb,var(--sky) 12%,transparent);border-color:color-mix(in srgb,var(--sky) 40%,var(--rule))}
.shelf{background:linear-gradient(160deg,color-mix(in srgb,var(--violet) 11%,var(--sheet)),var(--sheet) 70%);border-color:color-mix(in srgb,var(--violet) 28%,var(--rule))}
.shelf h3{color:color-mix(in srgb,var(--violet) 65%,var(--ink))}
/* ===== 아이보리 테마 (2026-10-11 사용자 요청) ===== */
:root{
  --paper:#F7F1E3; --sheet:#FFFBF2; --rule:#E2D8C2; --ink:#2E2820; --muted:#857B6A; --blank:#EDE4D0;
  --bar:#6E5038; --ring:#D9A514; --violet:#8A68C9; --orange:#E07F2E; --green:#3E9E64; --sky:#2E9BCB; --pink:#D2558F;
}
.bk[data-g="law"] .bk-name{color:#C27A1F}
.bk[data-g="hist"] .bk-name{color:#2F86A8}
.bk[data-g="poem"] .bk-name{color:#7A5CC4}
.bk[data-g="major"] .bk-name{color:#C24D6E}
.bk[data-g="minor"] .bk-name{color:#2E9A6A}
.bk[data-g="gospel"] .bk-name{color:#B07D08}
.bk[data-g="paul"] .bk-name{color:#4F67C2}
.bk[data-g="general"] .bk-name{color:#C26444}
.bk[data-g="rev"] .bk-name{color:#B2508F}
.chip::before{background:#EFE7D5;border-color:#DFD4BD}
.chip{color:#8C8270}
.chip[data-s="me"]{--c:#F2C94C;color:#3A2A00}
.meter{background:#ECE2CE}
.tg-all{background:#F1E9D8;color:var(--muted)}
.tg-all.tg-every{background:color-mix(in srgb,var(--ring) 16%,#FFFBF2);color:var(--ink)}
.bk-prog{background:conic-gradient(var(--c) calc(var(--p)*1%),#E6DCC8 0)}
.bk-prog b{background:var(--paper)}
.bk-prog[data-st="none"] b{color:#A39886}
.bk-prog[data-st="full"] b{color:#fff}

<script>
(function(){
"use strict";

/* 책 이름과 장 수. 성경 본문은 담지 않고, 권별 장 수만 쓴다. */
var OT=[["창세기",50],["출애굽기",40],["레위기",27],["민수기",36],["신명기",34],
["여호수아",24],["사사기",21],["룻기",4],["사무엘상",31],["사무엘하",24],
["열왕기상",22],["열왕기하",25],["역대상",29],["역대하",36],["에스라",10],
["느헤미야",13],["에스더",10],["욥기",42],["시편",150],["잠언",31],
["전도서",12],["아가",8],["이사야",66],["예레미야",52],["예레미야애가",5],
["에스겔",48],["다니엘",12],["호세아",14],["요엘",3],["아모스",9],
["오바댜",1],["요나",4],["미가",7],["나훔",3],["하박국",3],
["스바냐",3],["학개",2],["스가랴",14],["말라기",4]];
var NT=[["마태복음",28],["마가복음",16],["누가복음",24],["요한복음",21],["사도행전",28],
["로마서",16],["고린도전서",16],["고린도후서",13],["갈라디아서",6],["에베소서",6],
["빌립보서",4],["골로새서",4],["데살로니가전서",5],["데살로니가후서",3],["디모데전서",6],
["디모데후서",4],["디도서",3],["빌레몬서",1],["히브리서",13],["야고보서",5],
["베드로전서",5],["베드로후서",3],["요한일서",5],["요한이서",1],["요한삼서",1],
["유다서",1],["요한계시록",22]];

var BOOKS=OT.concat(NT);
var OT_N=OT.length;
var OFF=[],TOTAL=0;
for(var i=0;i<BOOKS.length;i++){OFF.push(TOTAL);TOTAL+=BOOKS[i][1];}   // 1189
var OT_TOTAL=OFF[OT_N], NT_TOTAL=TOTAL-OT_TOTAL;

var LS="bible-tongdok-v1";       // 기존 앱들과 겹치지 않는 저장 키
var me=new Uint8Array(TOTAL);    // 내 진도
var friend=null;                 // 친구 진도 (불러왔을 때만)
var friendName="";
var myName="";
var compare=false;

var $=function(id){return document.getElementById(id)};

/* 페이지 확대 막기 */
["gesturestart","gesturechange"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()},{passive:false})});
document.addEventListener("touchmove",function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
/* 홈 화면 앱·전체 화면일 때는 세로로 고정 (일반 브라우저 탭에서는 조용히 실패) */
try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock("portrait").catch(function(){})}catch(e){}

/* 모든 버튼에서 짧게 진동 (프로젝트 공통 규칙) */
/* 기존 앱(index.html)과 세기를 맞춘다. 8ms 는 폰에서 거의 안 느껴진다. */
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(Math.max(22,+ms||22))}catch(e){}}
document.addEventListener("click",function(ev){
  var b=ev.target.closest("button");
  if(!b)return;
  buzz(b.classList.contains("chip")?28:22);   // 장을 누를 때 조금 더 또렷하게
},true);

/* ── 저장 ─────────────────────────────── */
var meAt=0;   // 내 체크를 마지막으로 바꾼 시각 (여러 기기에서 맞출 때 더 최근 것을 씀)
function save(){
  var b=toB64(me), old=null; try{old=JSON.parse(localStorage.getItem(LS)||"null")}catch(e){}
  if(!old||old.b!==b)meAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify({n:myName,b:b,t:meAt}))}catch(e){}
  if(typeof cloudPush==="function")cloudPush();
}
function load(){
  try{
    var raw=localStorage.getItem(LS); if(!raw)return;
    var o=JSON.parse(raw);
    if(o&&typeof o.b==="string"){var a=fromB64(o.b); if(a)me=a;}
    if(o&&typeof o.n==="string")myName=o.n;
    if(o&&+o.t)meAt=+o.t;
  }catch(e){}
}

/* ── 코드 변환 (1189장을 비트로 눌러 담는다) ── */
function toB64(bits){
  var bytes=new Uint8Array(Math.ceil(TOTAL/8));
  for(var i=0;i<TOTAL;i++)if(bits[i])bytes[i>>3]|=1<<(i&7);
  var s="";for(var j=0;j<bytes.length;j++)s+=String.fromCharCode(bytes[j]);
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function fromB64(str){
  try{
    var s=String(str).replace(/-/g,"+").replace(/_/g,"/");
    while(s.length%4)s+="=";
    var bin=atob(s), bits=new Uint8Array(TOTAL);
    for(var i=0;i<TOTAL;i++){
      var b=bin.charCodeAt(i>>3)||0;
      bits[i]=(b>>(i&7))&1;
    }
    return bits;
  }catch(e){return null}
}
function encName(n){
  try{return btoa(unescape(encodeURIComponent(n||""))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
  catch(e){return ""}
}
function decName(s){
  try{
    var t=String(s||"").replace(/-/g,"+").replace(/_/g,"/");
    while(t.length%4)t+="=";
    return decodeURIComponent(escape(atob(t)));
  }catch(e){return ""}
}
/* 짧은 코드 (2026-10-11): 읽은 장은 대개 이어져 있으니 "안 읽음 n장, 읽음 m장…" 길이만 적는다.
   숫자 하나는 base64url 글자 1~3개 (5비트씩, 32를 더하면 다음 글자가 이어짐).
   모양: "2" + 길이들 [+ "." + 이름]   예) 아무것도 안 읽음 → "2"
   이게 비트 그대로보다 길면 "1" + 비트(base64) [+ "." + 이름]. 예전 "T1~이름~비트"도 그대로 읽는다 */
var B64C="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
function putNum(n){var out="";do{var v=n&31;n>>=5;out+=B64C[v|(n?32:0)]}while(n);return out}
function toRuns(bits){
  var runs=[],cur=0,len=0;
  for(var i=0;i<TOTAL;i++){var b=bits[i]?1:0;if(b===cur)len++;else{runs.push(len);cur=b;len=1}}
  if(cur===1)runs.push(len);   // 끝에 남은 '안 읽음'은 적지 않음
  return runs.map(putNum).join("");
}
function fromRuns(str){
  var bits=new Uint8Array(TOTAL),pos=0,cur=0,i=0;
  while(i<str.length){
    var n=0,sh=0,c;
    do{c=B64C.indexOf(str[i++]);if(c<0)return null;n|=(c&31)<<sh;sh+=5}while(c&32&&i<=str.length);
    if(cur)for(var k=0;k<n&&pos<TOTAL;k++)bits[pos++]=1;else pos+=n;
    if(pos>TOTAL)return null; cur^=1;
  }
  return bits;
}
function makeCode(){
  var r="2"+toRuns(me), raw="1"+toB64(me), body=r.length<=raw.length?r:raw;
  return body+(myName?"."+encName(myName):"");
}
function parseCode(txt){
  var s=String(txt||"").trim();
  var m=s.match(/[#?&]f=([^&\s]+)/);          // 링크를 통째로 붙여넣어도 받는다
  if(m)s=decodeURIComponent(m[1]);
  else{var h=s.indexOf("#");if(h>=0)s=s.slice(h+1)}   // 짧은 주소: …/t#코드
  var bits,name="";
  if(/^T1~/.test(s)){   // 예전 긴 코드
    var p=s.split("~"); if(p.length<3)return null;
    bits=fromB64(p[2]); name=decName(p[1]);
  }else if(/^[12]/.test(s)){
    var q=s.split("."), body=q[0].slice(1);
    bits=s[0]==="2"?fromRuns(body):fromB64(body); name=q[1]?decName(q[1]):"";
  }else return null;
  if(!bits)return null;
  return {name:name,bits:bits};
}
/* is.gd로 아주 짧게 (예: is.gd/AbC123). 같은 코드는 한 번만 줄이고 기억해 둠.
   is.gd가 #뒤를 놓칠 수 있어 ?c=코드 모양의 주소를 줄인다 (t 폴더가 통독표로 넘겨 줌) */
var SHORT_KEY="bible-tongdok-short";
function shortCache(){try{return JSON.parse(localStorage.getItem(SHORT_KEY)||"{}")||{}}catch(e){return {}}}
function shorten(code,done){
  var c=shortCache(); if(c[code]){done(c[code]);return}
  var cb="isgd_"+Date.now().toString(36)+Math.floor(Math.random()*1e4), sc=document.createElement("script"), fin=false;
  function end(v){if(fin)return;fin=true;try{delete window[cb]}catch(e){window[cb]=undefined}sc.remove();done(v)}
  window[cb]=function(r){
    var u=r&&r.shorturl?String(r.shorturl).replace(/^https?:\/\//,""):null;
    if(u){var m=shortCache();m[code]=u;var ks=Object.keys(m);if(ks.length>30)delete m[ks[0]];try{localStorage.setItem(SHORT_KEY,JSON.stringify(m))}catch(e){}}
    end(u);
  };
  var long=new URL("../t/",location.href.split("#")[0].split("?")[0]).href+"?c="+encodeURIComponent(code);
  sc.src="https://is.gd/create.php?format=json&callback="+cb+"&url="+encodeURIComponent(long);
  sc.onerror=function(){end(null)}; setTimeout(function(){end(null)},6000);
  document.head.appendChild(sc);
}
function makeLink(){
  // 가장 짧은 주소: …/bible-notes/t#코드 (t 폴더가 통독표로 넘겨 줌). "https://"도 빼서 카톡에 그대로 붙여도 링크가 됨
  var u=new URL("../t",location.href.split("#")[0].split("?")[0]);
  return u.host+u.pathname+"#"+makeCode();
}

/* ── 세기 ─────────────────────────────── */
function countRange(bits,from,to){var n=0;for(var i=from;i<to;i++)if(bits[i])n++;return n}
function bookDone(bi){return countRange(me,OFF[bi],OFF[bi]+BOOKS[bi][1])}

/* ── 그리기 ───────────────────────────── */
function chipState(idx){return me[idx]?"me":""}   // 내 표에는 내 것만 (친구 것은 바로 아래 따로 그림)
/* 친구와 비교할 때: 책마다 내 표 아래에 친구 표를 나란히 (보기 전용) */
function cmpOn(){return !!(friend&&compare)}
function friendChipsHTML(bi){
  var total=BOOKS[bi][1], base=OFF[bi], s='<div class="chips fchips" aria-label="'+esc(friendName||"친구")+'의 '+BOOKS[bi][0]+'">';
  for(var c=1;c<=total;c++){var idx=base+c-1;s+='<span class="chip"'+(friend[idx]?' data-s="fr"':'')+(c%5===0?' data-five':'')+'>'+c+'</span>'}
  for(var e=total%10?10-total%10:0;e>0;e--)s+='<span></span>';
  return s+'</div>';
}
function bodyHTML(bi){
  if(!cmpOn())return chipsHTML(bi);
  var total=BOOKS[bi][1], fd=countRange(friend,OFF[bi],OFF[bi]+total);
  return '<div class="who me-who">🙋 나 <span>'+bookDone(bi)+' / '+total+'</span></div>'+chipsHTML(bi)
    +'<div class="who fr-who">👤 '+esc(friendName||"친구")+' <span>'+fd+' / '+total+'</span></div>'+friendChipsHTML(bi);
}
/* 책 갈래: 색으로 구분하려고 쓴다 */
function bookGroup(bi){
  if(bi<5)return "law"; if(bi<17)return "hist"; if(bi<22)return "poem"; if(bi<27)return "major"; if(bi<39)return "minor";
  if(bi<43)return "gospel"; if(bi===43)return "hist"; if(bi<57)return "paul"; if(bi<65)return "general"; return "rev";
}
/* 📌 고정한 책: {책번호: 고정한 시각} — 맨 위 '읽는 중' 칸에 따로 보여 줌 (이 기기에 기억) */
var PIN_KEY="bible-tongdok-pin", pins={};
try{var pj=JSON.parse(localStorage.getItem(PIN_KEY)||"{}");if(pj&&typeof pj==="object")pins=pj}catch(e){}
function renderBooks(){
  var html=["",""], pinHtml={};
  for(var bi=0;bi<BOOKS.length;bi++){
    var name=BOOKS[bi][0], total=BOOKS[bi][1], done=bookDone(bi);
    var shut=!!folded[bi];
    var h='<section class="bk'+(done===total?" full":"")+(shut?" shut":"")+'" data-b="'+bi+'" data-g="'+bookGroup(bi)+'">'
      +'<div class="bk-h"><button class="bk-tg" type="button" data-act="fold" data-b="'+bi+'" aria-expanded="'+(!shut)+'"><span class="bk-chev" aria-hidden="true"></span><span class="bk-name">'+name+'</span>'
      +'<span class="bk-cnt">'+done+' / '+total+'</span></button>'
      +'<button class="bk-pin" type="button" data-act="pin" data-b="'+bi+'" aria-pressed="'+(!!pins[bi])+'" aria-label="'+name+(pins[bi]?" 고정 풀기":" 위에 고정")+'">📌</button>'
      +progBadge(done,total)+'</div>'
      +'<div class="bk-body">'+bodyHTML(bi)+'</div></section>';
    if(pins[bi])pinHtml[pins[bi]]=h; else html[bi<OT_N?0:1]+=h;
  }
  $("ot").innerHTML=html[0];
  $("nt").innerHTML=html[1];
  var pk=Object.keys(pinHtml).sort(function(a,b){return b-a});   // 최근에 고정한 책이 맨 위
  $("pin").innerHTML=pk.map(function(k){return pinHtml[k]}).join(""); $("pinned").hidden=!pk.length;
  syncFoldAll();
}
/* 책 접기·펴기 (이 기기에 기억) */
var FOLD_KEY="bible-tongdok-fold", folded={};
try{(JSON.parse(localStorage.getItem(FOLD_KEY)||"[]")||[]).forEach(function(b){folded[b]=1})}catch(e){}
function saveFold(){try{localStorage.setItem(FOLD_KEY,JSON.stringify(Object.keys(folded).map(Number)))}catch(e){}}
function setFold(bi,shut){
  if(shut)folded[bi]=1;else delete folded[bi];
  var sec=document.querySelector('.bk[data-b="'+bi+'"]'); if(!sec)return;
  sec.classList.toggle("shut",shut); sec.querySelector(".bk-tg").setAttribute("aria-expanded",String(!shut));
}
function syncFoldAll(){
  [["ot",0,OT_N],["nt",OT_N,BOOKS.length],["all",0,BOOKS.length]].forEach(function(t){
    var all=true; for(var b=t[1];b<t[2];b++)if(!folded[b]){all=false;break}
    var btn=document.querySelector('.tg-all[data-t="'+t[0]+'"]'); if(btn)btn.textContent=(t[0]==="all"?"66권 ":"")+(all?"모두 펴기":"모두 접기");
  });
}
/* 책 오른쪽 끝: 진행 상황을 링(색)과 숫자로 — 안 읽음 회색, 읽는 중 금빛 %, 다 읽음 초록 ✓ (2026-10-11 사용자 요청) */
function progBadge(done,total){
  var p=Math.round(done/total*100), st=done===0?"none":done===total?"full":"part";
  var txt=done===total?"✓":done===0?"0":p+"%";
  return '<span class="bk-prog" data-st="'+st+'" style="--p:'+(done/total*100).toFixed(1)+'" role="img" aria-label="'+(done===total?"다 읽음":p+"% 읽음")+'"><b>'+txt+'</b></span>';
}
function chipsHTML(bi){
  var total=BOOKS[bi][1], base=OFF[bi], s='<div class="chips">';
  for(var c=1;c<=total;c++){
    var idx=base+c-1, st=chipState(idx);
    s+='<button class="chip" type="button" data-act="chip" data-i="'+idx+'"'
      +(st?' data-s="'+st+'"':'')+(c%5===0?' data-five':'')
      +' aria-pressed="'+(!!me[idx])+'" aria-label="'+BOOKS[bi][0]+' '+c+'장">'+c+'</button>';
  }
  for(var e=total%10?10-total%10:0;e>0;e--)s+='<span></span>';   // 마지막 줄을 빈칸으로 채워 표 모양 유지
  return s+'</div>';
}
function repaintBook(bi){
  var sec=document.querySelector('.bk[data-b="'+bi+'"]');
  if(!sec)return;
  var total=BOOKS[bi][1], done=bookDone(bi);
  sec.classList.toggle("full",done===total);
  sec.querySelector(".bk-cnt").textContent=done+" / "+total;
  sec.querySelector(".bk-prog").outerHTML=progBadge(done,total);
  sec.querySelector(".bk-body").innerHTML=bodyHTML(bi);
}
function renderSummary(){
  var mine=countRange(me,0,TOTAL);
  var pctMe=mine/TOTAL*100;
  if(friend&&compare){
    var both=0,fo=0;
    for(var i=0;i<TOTAL;i++){if(me[i]&&friend[i])both++;else if(friend[i])fo++;}
    $("who").textContent="나와 "+(friendName||"친구");
    $("cnt").textContent="나 "+mine+"장 · "+(friendName||"친구")+" "+(both+fo)+"장 · 함께 "+both+"장";
    $("mBoth").style.width=(both/TOTAL*100)+"%";
    $("mMe").style.width=((mine-both)/TOTAL*100)+"%";
  }else{
    $("who").textContent=myName?myName+"의 진도":"내 진도";
    $("cnt").textContent=mine+" / "+TOTAL+"장 ("+Math.round(mine/TOTAL*100)+"%)";
    $("mBoth").style.width="0%";
    $("mMe").style.width=pctMe+"%";
  }
  $("barCnt").textContent=mine.toLocaleString()+" / "+TOTAL.toLocaleString();
  $("otCnt").textContent=countRange(me,0,OT_TOTAL)+" / "+OT_TOTAL+"장";
  $("ntCnt").textContent=countRange(me,OT_TOTAL,TOTAL)+" / "+NT_TOTAL+"장";
  $("legend").hidden=!(friend&&compare);
  $("btnCmp").hidden=!friend;
  $("btnCmp").textContent=compare?"비교 끄기":"비교 켜기";
}

/* ── 성경 책 찾기 (초성도 됨) ───────────────────── */
var CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
function chosung(t){return Array.prototype.map.call(String(t),function(ch){
  var c=ch.charCodeAt(0);
  return (c>=0xAC00&&c<=0xD7A3)?CHO.charAt(Math.floor((c-0xAC00)/588)):ch;
}).join("")}
function bkHit(name,q){
  var n=String(name).replace(/\s/g,""), w=String(q).replace(/\s/g,"");
  if(!w)return true;
  if(n.indexOf(w)>=0)return true;
  if(/^[ㄱ-ㅎ]+$/.test(w))return chosung(n).indexOf(w)>=0;
  return false;
}
function applyFind(){
  var el=document.getElementById("bkFind"); if(!el)return;
  var q=el.value.trim(), x=document.getElementById("bkFindX"), msg=document.getElementById("findMsg");
  if(x)x.hidden=!q;
  var secs=document.querySelectorAll(".bk[data-b]"), shown=0, seen={};
  Array.prototype.forEach.call(secs,function(sec){
    var bi=+sec.dataset.b, hit=bkHit(BOOKS[bi][0],q);
    sec.hidden=!hit;
    if(hit&&!seen[bi]){seen[bi]=1;shown++}
  });
  // 비어 버린 구약·신약 제목과 접기 단추는 찾는 동안 숨긴다
  document.querySelectorAll("h2.tg,.foldbar,.sum,.shelf").forEach(function(h){h.hidden=!!q});
  var pn=document.getElementById("pinned");
  if(pn&&q)pn.hidden=!Array.prototype.some.call(pn.querySelectorAll(".bk[data-b]"),function(s2){return !s2.hidden});
  if(msg){msg.hidden=!q; msg.textContent=q?(shown?shown+"권 찾았어요":"'"+q+"' 로 찾은 책이 없어요"):""}
}
(function(){
  var el=document.getElementById("bkFind"), x=document.getElementById("bkFindX");
  if(!el)return;
  ["input","compositionupdate","search"].forEach(function(ev){el.addEventListener(ev,applyFind)});
  if(x)x.addEventListener("click",function(){el.value="";applyFind();el.focus()});
})();

var queue=[], celOpen=false, pendingCheer=null;

function pushCel(c){queue.push(c);if(!celOpen)nextCel()}
function nextCel(){
  if(!queue.length){
    celOpen=false;$("cel").hidden=true;
    // 카드에 가려 못 띄운 격려가 있으면 이제 보여 준다
    if(pendingCheer){var p=pendingCheer;pendingCheer=0;cheer(p.bi,p.c)}
    return;
  }
  celOpen=true;
  var c=queue.shift();
  $("celSeal").textContent=c.icon||"✦";
  $("celTitle").textContent=c.t;
  $("celSub").textContent=c.s||"";
  $("celBless").textContent=c.b;
  $("celRef").textContent=c.r?"— "+c.r+" 말씀을 찾아 읽어 보세요":"";
  $("cel").hidden=false;
}
$("celOk").addEventListener("click",nextCel);
$("cel").addEventListener("click",function(ev){if(ev.target===$("cel"))nextCel()});

/* 체크한 칸에서 반짝이 터뜨리기 */
function sparkle(el){
  if(!el)return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  el.classList.remove("got");void el.offsetWidth;el.classList.add("got");
  var ring=document.createElement("span");ring.className="ring";el.appendChild(ring);
  for(var i=0;i<6;i++){
    var s=document.createElement("span");s.className="spark";
    var a=(Math.PI*2/6)*i-Math.PI/2, d=12+Math.random()*5;
    s.style.setProperty("--dx",(Math.cos(a)*d).toFixed(1)+"px");
    s.style.setProperty("--dy",(Math.sin(a)*d).toFixed(1)+"px");
    s.style.animationDelay=(i*12)+"ms";
    el.appendChild(s);
  }
  setTimeout(function(){
    var junk=el.querySelectorAll(".ring,.spark");
    for(var j=0;j<junk.length;j++)junk[j].remove();
  },700);
}

   축복 카드가 떠 있으면 미뤄 두었다가 카드를 닫은 뒤에 보여 준다. */
function maybeCheer(bi,c){
  if(!(c===1||c%5===0))return;
  if(celOpen){pendingCheer={bi:bi,c:c};return}
  cheer(bi,c);
}

/* 달라진 만큼만 축하한다 */
function checkMilestones(before,after,finishedBooks){
  for(var i=0;i<finishedBooks.length;i++){
    var bi=finishedBooks[i];
    var pick=BOOK_BLESS[bi%BOOK_BLESS.length];
    pushCel({icon:"✺",t:BOOKS[bi][0]+" 완독",
      s:BOOKS[bi][1]+"장을 모두 읽었어요. 뱃지를 하나 모았어요.",
      b:pick.b,r:pick.r});
  }
  for(var m=0;m<MILES.length;m++){
    var x=MILES[m];
    if(before<x.n&&after>=x.n){
      pushCel({icon:x.n===TOTAL?"♕":"✦",t:x.t,
        s:after+" / "+TOTAL+"장을 읽었어요.",b:x.b,r:x.r});
    }
  }
  var obT=countRange(me,0,OT_TOTAL);
  if(obT===OT_TOTAL&&before<after&&lastOT!==OT_TOTAL)
    pushCel({icon:"✵",t:"구약 39권 완독",s:OT_TOTAL+"장을 모두 읽었어요.",
      b:"긴 길을 끝까지 걸어오셨어요. 그 수고를 하나님이 아십니다.",r:"시편 126:5"});
  var nbT=countRange(me,OT_TOTAL,TOTAL);
  if(nbT===NT_TOTAL&&before<after&&lastNT!==NT_TOTAL)
    pushCel({icon:"✵",t:"신약 27권 완독",s:NT_TOTAL+"장을 모두 읽었어요.",
      b:"끝까지 읽어 내신 그 마음에 기쁨이 가득하기를.",r:"요한복음 20:31"});
  lastOT=obT;lastNT=nbT;
}
var lastOT=0,lastNT=0;

function renderShelf(){
  var got=[];
  for(var bi=0;bi<BOOKS.length;bi++)if(bookDone(bi)===BOOKS[bi][1])got.push(bi);
  $("shelfCnt").textContent=got.length?"  "+got.length+" / 66권":"";
  $("shelfNone").hidden=got.length>0;
  $("medals").innerHTML=got.map(function(bi){
    return '<span class="medal">'+BOOKS[bi][0]+'</span>';
  }).join("");
}

/* ── 조작 ─────────────────────────────── */
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]"); if(!el)return;
  var act=el.dataset.act;
  if(act==="pin"){
    var pb=+el.dataset.b; if(pins[pb])delete pins[pb]; else{pins[pb]=Date.now();delete folded[pb];saveFold()}
    try{localStorage.setItem(PIN_KEY,JSON.stringify(pins))}catch(e){}
    renderBooks(); if(pins[pb])window.scrollTo({top:0,behavior:"smooth"});
    return;
  }
  if(act==="fold"){var fb=+el.dataset.b;setFold(fb,!folded[fb]);saveFold();syncFoldAll();return}
  if(act==="foldall"){
    var t=el.dataset.t, a=t==="nt"?OT_N:0, z=t==="ot"?OT_N:BOOKS.length, shutAll=/접기$/.test(el.textContent);
    for(var fb2=a;fb2<z;fb2++)setFold(fb2,shutAll); saveFold(); syncFoldAll(); return;
  }

  if(act==="chip"){
    var idx=+el.dataset.i, bi2=bookOf(idx);
    var before=countRange(me,0,TOTAL), wasFull=bookDone(bi2)===BOOKS[bi2][1];
    me[idx]=me[idx]?0:1;
    save();
    repaintBook(bi2);
    renderSummary();renderShelf();
    var after=countRange(me,0,TOTAL);
    if(me[idx]){
      var spot=document.querySelector('.chip[data-i="'+idx+'"]');
      sparkle(spot);
      // 다섯 장째면 금빛 테두리가 한 번 번진다
      if(spot&&spot.hasAttribute("data-five")){
        spot.classList.remove("got5");void spot.offsetWidth;spot.classList.add("got5");
      }
      var nowFull=bookDone(bi2)===BOOKS[bi2][1];
      checkMilestones(before,after,(!wasFull&&nowFull)?[bi2]:[]);

(function(){

    BOOKS.forEach(function(b,bi){D.full[bi]=bookDone(bi)===b[1]});

  function cancelArm(){if(P){clearTimeout(P.t);P=null}}
  function move(x,y){
    if(P){var dx=Math.abs(x-P.x),dy=Math.abs(y-P.y);
      if(dx>8&&dx>dy*1.2){var c1=P.c;cancelArm();begin(c1)}   // 기다리지 않고 바로 옆으로 밀어도 칠하기 시작 (위아래로 밀면 스크롤)

    return true;
  }

    var d=D; D=null; document.body.classList.remove("painting"); eat=true; setTimeout(function(){eat=false},450);
    if(!d.n)return;

    }catch(e){setMsg("인터넷 연결을 확인해 주세요",true)}
    finally{b.disabled=false; if(b.textContent==="보내는 중…")b.textContent="로그인 메일 받기"}
  });
  $("lgOk").addEventListener("click",async function(){
    var raw=$("lgLink").value.trim(), em=$("lgMail").value.trim(), body=null;
    var lm=raw.match(/[?&#]token=([^&#\s]+)/), tm=raw.match(/[?&#]type=([a-z_]+)/), am=raw.match(/access_token=([^&#\s]+)/);
    if(am){var rt=(raw.match(/refresh_token=([^&#\s]+)/)||[])[1];if(rt){await finishLogin({access_token:decodeURIComponent(am[1]),refresh_token:decodeURIComponent(rt),expires_in:3600});return}}
    if(lm)body={type:tm?tm[1]:"magiclink",token_hash:decodeURIComponent(lm[1])};
    else{var code=raw.replace(/\D/g,"");if(code.length<6){setMsg("메일의 로그인 링크를 복사해 붙여 넣어 주세요",true);return}body={type:"email",email:em,token:code}}
    try{
      var vr=await fetch(SB_URL+"/auth/v1/verify",{method:"POST",headers:sbH(),body:JSON.stringify(body)});
      if(!vr.ok){setMsg("링크가 이미 쓰였거나 시간이 지났어요. '메일 다시 받기'로 새 링크를 받아 주세요",true);return}
      var j=await vr.json(); setSes(j); loginDone();
    }catch(e){setMsg("인터넷 연결을 확인해 주세요",true)}
  });
}
async function finishLogin(q){
  try{var u=await (await fetch(SB_URL+"/auth/v1/user",{headers:sbH(q.access_token)})).json();setSes({access_token:q.access_token,refresh_token:q.refresh_token,expires_in:+q.expires_in||3600,expires_at:+q.expires_at||0,user:u});loginDone()}
  catch(e){setMsg("로그인하지 못했어요. 다시 해 주세요",true)}
}
function loginDone(){
  try{localStorage.removeItem("bible-login-next")}catch(e){}
  closeDlg(); hint("로그인했어요 ☁️","이제 친구 코드로 친구를 맺으면 진도가 저절로 같이 보여요");
  cloudSync(false).then(function(){if(!cloudFriends.length)openFriends()});
  if(myName)setProfileName(myName);
}
async function setProfileName(n){try{var tok=await sbToken();if(!tok)return;await fetch(SB_URL+"/rest/v1/profiles?id=eq."+sbSession().user.id,{method:"PATCH",headers:Object.assign(sbH(tok),{"Prefer":"return=minimal"}),body:JSON.stringify({name:String(n).slice(0,20)})})}catch(e){}}
/* 👥 친구: 내 친구 코드를 알려 주고, 친구 코드를 넣어 신청·수락 (묵상 노트의 친구와 같은 것) */
async function openFriends(){
  if(!sbSession()){openLogin();return}
  $("dlgTitle").textContent="👥 친구";
  $("dlgDesc").textContent="서로 친구 코드를 주고받아 한 사람이 넣으면 신청, 다른 사람이 수락하면 친구가 돼요. 친구가 되면 진도가 저절로 같이 보여요.";
  $("dlgBody").innerHTML='<div class="fr-box">불러오는 중…</div>';
  $("dlgTools").innerHTML='<button class="btn wide" type="button" id="frOut">로그아웃</button><button class="btn wide" type="button" id="frCl">닫기</button>';
  $("dlg").hidden=false;
  $("frCl").addEventListener("click",function(){closeDlg();cloudSync(false)});
  $("frOut").addEventListener("click",function(){
    if(!this.dataset.sure){this.dataset.sure="1";this.textContent="한 번 더 누르면 로그아웃";return}
    try{localStorage.removeItem(SB_SES)}catch(e){} cloudFriends=[]; closeDlg(); drawCloud(); hint("로그아웃했어요","체크는 이 휴대폰에 그대로 있어요");
  });
  drawFriends();
}
async function drawFriends(){
  var box=$("dlgBody").querySelector(".fr-box"); if(!box)return;
  try{
    var tok=await sbToken(); if(!tok){box.textContent="다시 로그인해 주세요";return}
    var uid=sbSession().user.id;
    var fr=await sbGet(tok,"/rest/v1/friendships?select=requester,addressee,status");
    var ids=fr.map(function(f){return f.requester===uid?f.addressee:f.requester});
    var pf=await sbGet(tok,"/rest/v1/profiles?select=id,name,friend_code&id=in.("+[uid].concat(ids).join(",")+")"), pm={}; pf.forEach(function(p){pm[p.id]=p});
    var meP=pm[uid]||{}, nm=function(id){return esc((pm[id]&&pm[id].name)||"이름 없음")};
    var acc=fr.filter(function(f){return f.status==="accepted"}), inc=fr.filter(function(f){return f.status==="pending"&&f.addressee===uid}), out=fr.filter(function(f){return f.status==="pending"&&f.requester===uid});
    var h='<div class="fr-me">내 친구 코드 <b class="fr-code">'+esc(meP.friend_code||"……")+'</b> <button type="button" class="cl-re" id="frCopy">복사</button></div>'
      +'<div class="fr-name">내 이름 <input type="text" id="frNm" maxlength="20" value="'+esc(meP.name||myName||"")+'" placeholder="친구에게 보일 이름"><button type="button" class="cl-re" id="frNmSave">저장</button></div>'
      +'<div class="fr-add"><input type="text" id="frCode" maxlength="8" placeholder="친구 코드 6자리" autocapitalize="characters"><button type="button" class="btn on" id="frReq">친구 신청</button></div>';
    if(inc.length)h+='<div class="fr-h">받은 신청</div>'+inc.map(function(f){return '<div class="fr-row">'+nm(f.requester)+' <button type="button" class="btn on fr-acc" data-u="'+f.requester+'">수락</button></div>'}).join("");
    if(out.length)h+='<div class="fr-h">보낸 신청 (상대가 수락하면 친구)</div>'+out.map(function(f){return '<div class="fr-row">'+nm(f.addressee)+' · 기다리는 중</div>'}).join("");
    h+='<div class="fr-h">친구 '+acc.length+'명</div>'+(acc.length?acc.map(function(f){var o=f.requester===uid?f.addressee:f.requester;return '<div class="fr-row">👤 '+nm(o)+'</div>'}).join(""):'<div class="fr-row fr-none">아직 없어요. 친구 코드를 주고받아 보세요.</div>');
    box.innerHTML=h;
    $("frCopy").addEventListener("click",function(){copy(meP.friend_code||"").then(function(){setMsg("친구 코드를 복사했어요. 카톡으로 보내 주세요.")})});
    $("frNmSave").addEventListener("click",async function(){var v=$("frNm").value.trim();if(!v)return;myName=v;save();await setProfileName(v);setMsg("이름을 저장했어요.")});
    $("frReq").addEventListener("click",async function(){
      var c=$("frCode").value.trim().toUpperCase(); if(c.length<4){setMsg("친구 코드를 넣어 주세요",true);return}
      try{var r=await fetch(SB_URL+"/rest/v1/rpc/request_friend",{method:"POST",headers:sbH(await sbToken()),body:JSON.stringify({code:c})});var t=await r.json();
        setMsg({requested:"친구 신청을 보냈어요. 친구가 수락하면 진도가 보여요.",accepted:"친구가 됐어요! 🎉",already:"이미 친구예요.",self:"내 코드예요. 친구의 코드를 넣어 주세요.",notfound:"그 코드를 찾지 못했어요.",login:"다시 로그인해 주세요."}[t]||("결과: "+t),t==="notfound"||t==="self");
        drawFriends(); if(t==="accepted")cloudSync(false);
      }catch(e){setMsg("인터넷 연결을 확인해 주세요",true)}
    });
    box.querySelectorAll(".fr-acc").forEach(function(b){b.addEventListener("click",async function(){
      try{var tk=await sbToken();await fetch(SB_URL+"/rest/v1/friendships?requester=eq."+b.dataset.u+"&addressee=eq."+uid,{method:"PATCH",headers:Object.assign(sbH(tk),{"Prefer":"return=minimal"}),body:JSON.stringify({status:"accepted"})});setMsg("친구가 됐어요! 🎉");drawFriends();cloudSync(false)}catch(e){setMsg("인터넷 연결을 확인해 주세요",true)}
    })});
  }catch(e){box.textContent="친구 정보를 받지 못했어요. 인터넷 연결을 확인해 주세요."}
}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&sbSession())cloudSync(false)});
setInterval(function(){if(!document.hidden&&sbSession())cloudSync(false)},60000);

/* ── 시작 ─────────────────────────────── */
load();
/* 이미 읽어 둔 만큼은 축하가 다시 뜨지 않게 기준을 맞춰 둔다 */
lastOT=countRange(me,0,OT_TOTAL);
lastNT=countRange(me,OT_TOTAL,TOTAL);
/* 링크로 열렸으면 그 진도를 친구 것으로 본다 (내 체크는 건드리지 않는다) */
if(/access_token=/.test(location.hash)){   // 메일 링크가 통독표로 바로 돌아온 경우
  var lq={}; location.hash.replace(/^#/,"").split("&").forEach(function(kv){var a=kv.split("=");lq[decodeURIComponent(a[0])]=decodeURIComponent(a[1]||"")});
  try{history.replaceState(null,"",location.pathname)}catch(e){}
  if(lq.access_token&&lq.refresh_token)finishLogin(lq);
}
var fromLink=parseCode(location.hash);
if(fromLink){
  friend=fromLink.bits;friendName=fromLink.name;compare=true;saveFriend();
  try{history.replaceState(null,"",location.pathname)}catch(e){}
}else loadFriend();
renderAll();
drawCloud(); if(sbSession())cloudSync(false);
})();
</script>
